<!DOCTYPE html>
<html>
<head>
  <title>Student Registration Form</title>
</head>
<body>

<h2>Student Registration Form</h2>

<form>
  <table>
    <tr>
        <td>Roll no.:</td>
        <td><input type="text"></td>
    </tr>
    <tr>
        <td>Student name:</td>
        <td><input type="text" placeholder="First Name"> 
            <input type="text" placeholder="Last Name">
        </td>
    </tr>
    <tr>
        <td>Father's name:</td>
        <td><input type="text"></td>
    </tr>
    <tr>
        <td>Date of birth:</td>
        <td><input type="date"></td>
    </tr>
    <tr>
        <td>Mobile no.:</td>
        <td>+91 - <input type="tel"></td>
    </tr>
    <tr>
        <td>Email id:</td>
        <td><input type="email"></td>
    </tr>
    <tr>
        <td>Password:</td>
        <td><input type="password"></td>
    </tr>
    <tr>
        <td>Gender:</td>
        <td><input type="radio" name="gender"> Male 
            <input type="radio" name="gender"> Female
        </td>
    </tr>
    <tr>
        <td>Department:</td>
        <td><input type="checkbox"> CSE 
            <input type="checkbox"> IT 
            <input type="checkbox"> ECE 
            <input type="checkbox"> Civil
            <input type="checkbox"> Mech
        </td>
    </tr>
    <tr><td>Course:</td><td>
      <select>
        <option>Select Current Course</option>
        <option>B.Tech</option>
        <option>B.Sc</option>
        <option>M.Tech</option>
      </select>
    </td></tr>
    <tr><td>Student photo:</td><td><input type="file"></td></tr>
    <tr><td>City:</td><td><input type="text"></td></tr>
    <tr><td>Address:</td><td><textarea></textarea></td></tr>
  </table>
</form>

</body>
</html>
